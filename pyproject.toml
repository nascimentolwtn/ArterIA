[project]
name = "arteria"
version = "0.2.0"
description = "AI-assisted decision-support tool for street-network planning, evaluated against calibrated SUMO simulations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
arteria = "arteria.cli:app"

[project.optional-dependencies]
dev = [
    "nox>=2024.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-PyYAML",
]
geo = [
    "geopy>=2.4",
    "shapely>=2.1",
    "pyproj>=3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arteria*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
