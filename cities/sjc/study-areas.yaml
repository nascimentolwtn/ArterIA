# SJC study-area geocoding queries (roadmap P1.4), consumed by
# `arteria studyarea build --city sjc` (arteria/network/study_area.py).
#
# Each candidate's `queries` are landmark/address strings derived from
# cities/sjc/candidate-corridors.md's descriptions — geocoded via Nominatim
# at the desk (this remote session's network policy blocks
# nominatim.openstreetmap.org), convex-hulled, then buffered by `buffer_m`
# metres to produce a draft polygon. Treat the output as a DRAFT: verify it
# against satellite imagery/OSM before using it for any real P2.1 OSM
# extraction, same as the roadmap already expects for OSM completeness.
#
# NOTE (2026-10-27): re-running Nominatim drifted some older landmark results, which
# would have moved A/D. study-areas.geojson therefore pins the 2026-10-25 A and D
# polygons and builds B and C as convex_hull(old polygon U buffered hull of the
# extension queries marked "Extension"/"extension" below). Re-running the build from
# scratch will not reproduce A/D exactly.
#
# Priority order per the owner's 2026-10-25 decision: B > D > C > A.

candidates:
  - id: b
    name: "Av. Andrômeda <-> DCTA / Jardim Satélite"
    priority: 1
    queries:
      - "Avenida Andrômeda, Jardim Satélite, São José dos Campos, SP, Brazil"
      - "Departamento de Ciência e Tecnologia Aeroespacial, São José dos Campos"  # DCTA (street-address query found nothing in Nominatim)
      - "Vila Letônia, São José dos Campos, SP, Brazil"
      - "Vila São Bento, São José dos Campos, SP, Brazil"
      - "Avenida Florestan Fernandes, São José dos Campos, SP, Brazil"  # connects to A, per owner's decision
      # Southern extension (owner feedback 2026-10-27): the loop/one-way structure continues
      # south through Jd. Satélite. Verified 2026-10-27: all land in Jd. Satélite, lat -23.229..-23.235.
      - "Avenida Cassiopéia, Jardim Satélite, São José dos Campos"   # -23.2293, -45.8851
      - "Avenida Perseu, Jardim Satélite, São José dos Campos"       # -23.2287, -45.8911
      - "Avenida Perseu, 12233-190, São José dos Campos"             # -23.2345, -45.8910 (south end)
    buffer_m: 400
    note: >
      Polygon connects to candidate A's Anel Viário segment (owner decision,
      2026-10-25) rather than standing alone. Extended south through Jd. Satélite
      (Av. Cassiopéia / Av. Perseu) on owner feedback, 2026-10-27.

  - id: d
    name: "Jardim Colinas roundabout / Ponte Estaiada"
    priority: 2
    queries:
      - "Avenida Jorge Zarur, São José dos Campos, SP, Brazil"
      - "Avenida São João, São José dos Campos, SP, Brazil"
      - "Avenida Cassiano Ricardo, São José dos Campos, SP, Brazil"
      - "Avenida Doutor Eduardo Cury, São José dos Campos, SP, Brazil"
    buffer_m: 250
    note: null

  - id: c
    name: "Centro / São Dimas / Vila Adyana one-way maze"
    priority: 3
    queries:
      - "Praça Afonso Pena, Centro, São José dos Campos"  # plain "Centro" geocodes ~30 km north (-22.91, -45.96)
      - "São Dimas, São José dos Campos, SP, Brazil"
      - "Vila Adyana, São José dos Campos, SP, Brazil"
      # Extension (owner feedback 2026-10-27): the one-way turn/loop structure continues
      # around Parque Vicentina Aranha. Verified 2026-10-27: all in SJC, Vila Adyana / Vila Ema /
      # Jd. Esplanada, i.e. west and south-west of the original polygon (not literally north).
      - "Parque Vicentina Aranha, São José dos Campos"               # -23.1983, -45.8953
      - "Avenida Barão do Rio Branco, Jardim Esplanada, São José dos Campos"  # -23.1978, -45.9048
      - "Rua Madre Paula de São José, Vila Ema, São José dos Campos" # -23.2029, -45.9002
      - "Rua José Francisco Alves, Vila Ema, São José dos Campos"    # -23.2059, -45.9025
    buffer_m: 300
    note: >
      Extended west/south-west to Parque Vicentina Aranha, Av. Rio Branco,
      R. Madre Paula de São José and R. José Francisco Alves (owner, 2026-10-27).

  - id: a
    name: "Anel Viário and its access roads"
    priority: 4
    queries:
      - "Avenida Florestan Fernandes, São José dos Campos, SP, Brazil"
      - "Avenida Senador Teotônio Vilela, São José dos Campos, SP, Brazil"
      - "Viaduto Everardo Passos, São José dos Campos, SP, Brazil"
      - "Viaduto Nadim Rahal, São José dos Campos, SP, Brazil"
    buffer_m: 400
    note: null

  - id: b_ext_vista_verde
    name: "Future extension: Av. Andrômeda/DCTA <-> Vista Verde (northbound)"
    priority: null
    enabled: false
    queries:
      - "Vista Verde, São José dos Campos, SP, Brazil"
    buffer_m: 400
    note: >
      Optional future extension (owner, 2026-10-25): the same DCTA<->Dutra
      dependency reported for candidate B also applies northbound, toward
      Vista Verde. Not current priority — disabled by default; pass
      --include-future to `arteria studyarea build` to geocode it too.
