      hierarchy, public transport, cycling and pedestrian mobility baselines.
    roadmap_ref: P1.1
    agency: "Ipplan / Secretaria de Mobilidade Urbana (SEMOB)"
    license: "unknown — likely public municipal document; confirm terms on receipt"
    visibility: public
    sha256: null
    status: deferred
    notes: >
      Referenced in docs/research-brief-sjc.md [74]; exact current URL not
      verified by this session — locate via sjc.sp.gov.br or request the PDF
      directly from Ipplan/SEMOB rather than guessing a link.

  - id: master-plan-lc612-2018
    name: "Plano Diretor — Lei Complementar 612/2018"
    description: >
      Current Master Plan; defines road macrostructure, road hierarchy and
      cycling network based on PlanMob.
    roadmap_ref: P1.1
    agency: "Prefeitura de São José dos Campos"
    license: "public law text"
    visibility: public
    sha256: null
    status: public_available
    notes: >
      Referenced in docs/research-brief-sjc.md [72][75]. The law text is at
      servicos.sjc.sp.gov.br/Legislacao (search "LC 612/2018"; a 2000-era law
      confirms the path pattern:
      https://servicos.sjc.sp.gov.br/Legislacao/Arquivos/Leis/2000/LE_2000_00005680.pdf).
      The map layers it defines (road hierarchy, macrostructure) are also on
      Geosanja (see `geosanja-plano-diretor-zoneamento`) — no request needed
      for either; self-service download covers this entry.

