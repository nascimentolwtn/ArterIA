  - id: od-survey-microdata
    name: "Pesquisa Origem-Destino (OD) — microdata"
    description: >
      Household/trip-level OD microdata used for demand estimation in the
      "Mobilidade do Futuro" project (roadmap P3.1-P3.3 demand generation).
    roadmap_ref: P1.1, P3.2
    agency: Ipplan
    license: "TBD — expect data-sharing terms restricting redistribution"
    visibility: restricted
    sha256: null
    status: declined
    notes: >
      Referenced in docs/research-brief-sjc.md [73]. **Declined by owner
      decision, 2026-10-25 (ADR 0013):** never requested, received, used, or
      derived from (including by randomizing/anonymizing a real copy), given
      the re-identification/LGPD risk of household/trip-level microdata, not
      just its commercial/contractual restriction. Demand generation (P3)
      uses a synthetic, count-calibrated scenario instead (gravity-model
      fallback + `routeSampler`), permanently, not as a contingency pending
      release. Unlike `deferred`, this status is not expected to change if
      Ipplan ever does release it. Does not affect `od-survey-atlas`
      (aggregated/public) above.

