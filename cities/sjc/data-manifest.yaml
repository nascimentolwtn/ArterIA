    agency: "SEMOB / transit operator"
    license: "TBD — confirm on receipt"
    visibility: public
    sha256: null
    status: deferred
    notes: >
      Transit is run by Consórcio 123 (named operators found: Expresso
      Maringá, Joseense Transporte, plus a third not confirmed by this
      session) under SEMOB. A 2021 bidding process to replace the concession
      was reported annulled; current operator/contract status needs
      confirming with SEMOB before this request is sent, since it may have
      changed since.

      Desk check 2026-10-27: a web search found no public GTFS download for
      SJC (no feed on the city portal, none surfaced in aggregator searches).
      The city's own mobility study (sjc.sp.gov.br/media/148076, "insumos para a
      projecao inicial de oferta e demanda") analyses GTFS for lines 101 and 319,
      so a feed exists at SEMOB/the operators but is not published. Not
      confirmed against the OpenStreetMap wiki GTFS list or MobilityData's
      catalogue (not fetched). P2.6 import not implemented; status stays deferred.

