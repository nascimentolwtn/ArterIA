# SJC data-source manifest (roadmap P1.1 / P1.2).
#
# Shape follows the data-manifest schema drafted in docs/adr/0003-city-config-and-data-schema.md
# (Status: Proposed, not yet accepted) — expect fields to shift once that ADR is reviewed.
# `sha256` stays null until a file is actually received and checked into ARTERIA_DATA/ARTERIA_PRIVATE;
# per ADR 0004, no restricted file's bytes or checksum are ever committed to this repo.
#
# status values: public_available (no request needed, self-service download) |
#                 deferred (a request draft exists in data-requests.md, but the owner
#                 chose not to contact any agency at this stage of the work) |
#                 requested (sent, awaiting reply) | received | unavailable
#
# 2026-10-24: the owner decided not to contact SJC agencies at this point in the
# work. Every item below that still needs an agency reply is marked `deferred`
# (see cities/sjc/data-requests.md). The street-network need that originally
# motivated part of this list is covered instead by the public, self-service
# sources listed first (osm-network-extract, geosanja-plano-diretor-zoneamento,
# ibge-faces-logradouros) — no contact with anyone required for those.
#
# Last reviewed: 2026-10-28 (the three public network sources downloaded and cross-checked).

sources:
  - id: osm-network-extract
    name: "OpenStreetMap road network extract"
    description: >
      Street geometry, names, lane counts, one-way status and turn
      restrictions where tagged, clipped to the SJC study area. The primary,
      no-contact source for the network build (roadmap P2.1-P2.2).
    roadmap_ref: P2.1, P2.2
    agency: "OpenStreetMap contributors (via Geofabrik regional extract or Overpass API)"
    license: "ODbL"
    visibility: public
    sha256: null
    status: public_available
    notes: >
      Self-service: Geofabrik publishes a daily `sudeste` (southeast Brazil)
      PBF extract; clip to the study-area polygon with `osmium extract`, or
      query Overpass directly for a small pilot corridor. No municipal
      contact needed. Desk check 2026-10-26: Geofabrik, Overpass and Nominatim
      are all reachable now (the earlier block was a remote-session policy).
      Kontur's OSM Road Completeness map is only an interactive web map, so
      it gave no checkable number. What was measured instead is tag
      completeness of the candidate-B clip (739 highway ways, local extract
      from the 2026-10-25 Geofabrik Sudeste download): motorway/trunk/primary
      have name, lanes, maxspeed tags almost fully (primary: lanes 95%,
      maxspeed 73%); secondary is partial (name 90%, lanes 61%, maxspeed 42%);
      residential (245 ways) has name 84% but lanes 4% and maxspeed 5%, so
      SUMO falls back on defaults there. This measures tagging, NOT geometric
      or missing-street completeness: no independent reference (IBGE faces,
      satellite) could be compared, so geometric completeness is still
      unverified and nothing here is a completeness percentage.

      Pinned 2026-10-27 in `cities/sjc/network/osm-snapshot.yaml`: Sudeste PBF
      (data timestamp 2026-10-25T21:21:21Z) sha256 309645f3...dbb7, 862,437,567
      bytes, and the clipped whole-city envelope `sjc-all.osm.pbf` sha256
      6e1a20d5...b751. `arteria network rebuild --city sjc` verifies both.

  - id: geosanja-plano-diretor-zoneamento
    name: "Geosanja — Plano Diretor and Zoneamento map layers"
    description: >
      The city's own open geodata portal. Its first stage (launched 2019)
      published downloadable map layers for the Master Plan (LC 612/2018)
      and the land-use/zoning law (LC 623/2019) — the same road-hierarchy
      and macrostructure content `master-plan-lc612-2018` below needed a
      request for, now obtainable by self-service download instead.
    roadmap_ref: P1.1, P2.5
    agency: "Prefeitura de São José dos Campos (self-service portal, no contact needed)"
    license: "unknown, not shown on site"
    visibility: public
    sha256: null
    status: public_available
    notes: >
      Downloaded 2026-10-28 (gitignored; no license terms are shown on the
      site; sha256 left null here, hashes below are for the local copies).
      data/geoSJC-arruamentos.zip, sha256
      cbe177f554f1521150b5f4afb58a798a9e37b81268fd5e9156eb7ed628b31311,
      7,543,974 bytes: GeoSanja (https://geo.sjc.sp.gov.br/) category
      "04 Bases de Referência > 02 Infraestruturas > Arruamentos", GeoJSON.
      data/geoSJC-anexo_09.zip, sha256
      89593cae0f22f46a4fd284b0e9d19c1aa5f344b117ade1e0d91f06b4d3c163e7,
      146,747 bytes: "01 PDDI > 09 Hierarquia Viária" (inner zips
      macroestruturaViariaBasica, macroestruturaViariaPrioritaria,
      perimetroUrbano; GeoJSON+SLD). Extracted copies are under
      data/geosanja/. The portal (geo.sjc.sp.gov.br, an Angular web-GIS app
      backed by GeoServer) offers a download tool for these layers; see
      data/REPORT.md for the layer catalogue.

  - id: ibge-faces-logradouros
    name: "IBGE — Base de Faces de Logradouros do Brasil"
    description: >
      Nationwide street-face/centerline layer per municipality from the
      Census, with street type/name and address-count attributes. Useful to
      cross-check OSM street names and completeness for SJC independently
      of any OSM editing gaps.
    roadmap_ref: P2.5
    agency: "IBGE (self-service download, no contact needed)"
    license: "public download; no license terms shown"
    visibility: public
    sha256: eaacab21ef90e0352a46f43f2d156a81888547850603651492ceb713c09703e6
    status: public_available
    notes: >
      Downloaded 2026-10-28 (gitignored). Source page:
      https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais/28971-base-de-faces-de-logradouros-do-brasil.html
      (edition 2022, Resultados Preliminares). Local file
      data/SP_faces_de_logradouros_2022_shp.zip, sha256
      eaacab21ef90e0352a46f43f2d156a81888547850603651492ceb713c09703e6,
      395,483,363 bytes. It is the state-level SP zip and contains the SJC
      file SP/3549904_faces_de_logradouros_2022.*; the extracted copy is
      under data/ibge-faces/. Used for the name cross-check in
      data/crosscheck/ (key = NM_TIT_LOG + NM_LOG).

